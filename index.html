<script>
(function(){try{var d=document.documentElement,t=localStorage.getItem('lexiprof_theme'),a=localStorage.getItem('lexiprof_accent');
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.dataset.theme=t;if(a)d.dataset.accent=a;try{var c=JSON.parse(localStorage.getItem('lexiprof_consent')||'null');if(c&&c.fonts){var l=document.createElement('link');l.rel='stylesheet';l.id='gfonts';l.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&display=swap';document.head.appendChild(l);}}catch(e){}var f=+localStorage.getItem('lexiprof_fs');if(f>=80&&f<=140)d.style.fontSize=f+'%';d.dataset.tint=localStorage.getItem('lexiprof_tint')==='0'?'off':'on';
if(localStorage.getItem('lexiprof_rm')==='1')d.dataset.motion='reduce';}catch(e){}})();
</script>
